{% extends "layout.html" %}
{% block title %}Edit Product{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1>Edit Product</h1>
        <p class="subtitle">Update the details for {{ product[1] }}.</p>
    </div>
    <a href="/products" class="btn btn-outline"><i class="fa-solid fa-arrow-left"></i> Back to Inventory</a>
</div>

<div class="form-container card">
    <form action="/edit/{{ product[0] }}" method="POST">
        <div class="form-grid">
            <div class="form-group full-width">
                <label for="new_product_id">Product ID</label>
                <input type="number" id="new_product_id" name="new_product_id" value="{{ product[0] }}" class="form-input" required>
            </div>
            
            <div class="form-group">
                <label for="product_name">Product Name</label>
                <input type="text" id="product_name" name="product_name" value="{{ product[1] }}" class="form-input" required>
            </div>
            
            <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" name="category" value="{{ product[2] }}" class="form-input" required>
            </div>
            
            <div class="form-group">
                <label for="price">Price (₹)</label>
                <div class="input-with-icon">
                    <i class="fa-solid fa-indian-rupee-sign"></i>
                    <input type="number" id="price" name="price" step="0.01" value="{{ product[3] }}" class="form-input" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" name="quantity" value="{{ product[4] }}" class="form-input" required>
            </div>
            
            <div class="form-group full-width">
                <label for="supplier">Supplier Name</label>
                <input type="text" id="supplier" name="supplier" value="{{ product[5] }}" class="form-input" required>
            </div>
        </div>
        
        <div class="form-actions">
            <a href="/products" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-primary"><i class="fa-solid fa-check"></i> Update Product</button>
        </div>
    </form>
</div>
{% endblock %}
